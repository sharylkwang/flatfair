<label class="mini-field" for="{{ field.id_for_label }}">{{ field.label }} {{ field }}
  {% if field.errors %}<span class="err" id="{{ field.auto_id }}_error">{{ field.errors.0 }}</span>{% elif field.field.warning %}<span class="field-warn">{{ field.field.warning }}</span>{% endif %}{% if field.help_text %}<span class="field-help{% if field.errors or field.field.warning %} visually-hidden{% endif %}" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</span>{% endif %}
</label>
