<form method="post" action="{% url 'activity_action' %}" class="activity-form"{% if ask %} data-ask="{{ ask }}" data-yes="{{ yes|default:label }}" data-no="{{ no|default:'Go back' }}"{% endif %}>{% csrf_token %}<input type="hidden" name="id" value="{{ id }}"><button class="btn {{ tone|default:'btn-ghost' }} btn-sm" name="action" value="{{ action }}">{{ label }}{% if about %} <span class="visually-hidden">{{ about }}</span>{% endif %}</button></form>
