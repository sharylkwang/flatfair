{% load static estate_tags %}
{% with cover=flat.coverPhoto %}{% if cover %}<img class="flat-thumb flat-thumb--{{ size|default:'small' }}" src="{{ cover.publicUrl }}" alt="{{ cover.get_room_display }} in Blk {{ flat.block }}, {{ flat.town|title }}" width="1536" height="1024" loading="lazy" decoding="async">{% else %}{% estatePhoto flat as estateImage %}<span class="flat-thumb flat-thumb--{{ size|default:'small' }} flat-thumb-estate"><img src="{% static estateImage %}?r=4" alt="HDB estate, not this flat" width="960" height="640" loading="lazy" decoding="async"><small>Estate photo</small></span>{% endif %}{% endwith %}
